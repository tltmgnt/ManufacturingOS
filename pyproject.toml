[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "manufacturingos"
dynamic = ["version"]
description = "Advisory manufacturing planning, synthetic simulation, and reproducible study reviews"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.urls]
Repository = "https://github.com/tltmgnt/ManufacturingOS"

[project.scripts]
manufacturing-os = "manufacturing_os.cli:main"

[tool.setuptools.dynamic]
version = {attr = "manufacturing_os._version.__version__"}

[tool.setuptools.packages.find]
include = ["manufacturing_os*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
manufacturing_os = ["contracts/*.schema.json"]
