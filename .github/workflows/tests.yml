name: prototype-tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python -m manufacturing_os examples/synthetic-cnc.json
      - run: python -m manufacturing_os.calculations examples/serial-route.json --variants examples/serial-route-variants.json
      - run: python -m manufacturing_os.experiments validate examples/arithmetic-references.json
      - run: python -m manufacturing_os.experiments simulate examples/uncertainty-experiment.json
      - run: python -m manufacturing_os.simulation examples/finite-batch.json
      - run: python -m manufacturing_os.study examples/integrated-study.json
